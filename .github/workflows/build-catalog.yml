name: Build static Quran catalog
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-catalog.cjs'
      - 'scripts/check-catalog.cjs'
      - '.github/workflows/build-catalog.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: write
concurrency:
  group: quran-catalog-generation
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate validated pages and sitemap
        run: node scripts/build-catalog.cjs
      - name: Audit generated links and metadata
        run: node scripts/check-catalog.cjs
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/
          if ! git diff --cached --quiet; then
            git commit -m "Update verified static Quran catalog"
            git push
          fi
