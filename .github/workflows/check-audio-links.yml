name: Check external audio links
on:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check every surah link
        run: node scripts/check-audio-links.mjs
