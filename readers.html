    <style>
        .directory-main {
            padding: 35px 0 160px
        }

        .directory-nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 18px 0
        }

        .directory-nav a {
            background: var(--surface);
            border: 1px solid var(--line);
            padding: 8px 13px;
            text-decoration: none;
            border-radius: 11px
        }

        .directory-tools {
            margin: 15px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap
        }

        .directory-tools input {
            min-width: 220px;
            flex: 1;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface);
            color: var(--ink)
        }

        .directory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
            gap: 12px
        }

        .directory-card {
            display: block;
            text-decoration: none;
            padding: 17px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: var(--surface)
        }

        .directory-card strong {
            display: block;
            font-size: 1.1rem
        }

        .directory-card small {
            color: var(--muted)
        }

        .directory-card:hover {
            border-color: var(--brand)
        }

        .directory-status {
            padding: 12px;
            color: var(--muted)
        }
    </style>
